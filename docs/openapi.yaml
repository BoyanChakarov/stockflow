          headers:
            Retry-After:
              schema:
                type: string
                const: '1'
              description: Retry after one second.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        description: Token from GET /api/v1/csrf; refresh after login.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
