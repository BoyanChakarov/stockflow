            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Stock, state, uniqueness or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Lock timeout/deadlock; retry unchanged with the same key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: string
                const: '1'
              description: Retry after one second.
      parameters:
      - &id002
        name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - &id003
        name: size
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        description: Trimmed case-insensitive substring search; SQL wildcard characters
          are treated literally.
        schema:
          type: string
          maxLength: 100
      - name: active
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: sort
        in: query
        required: false
        description: 'Allowed fields: sku, name, createdAt, unitPrice. Optional ,asc
          or ,desc; ID is the tiebreaker. Default sku.'
        schema:
          type: string
    post:
      summary: Create product
      operationId: postApiV1Products
      tags:
      - products
      description: 'Permission: ADMIN. '
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              schema:
                type: string
              description: API URI of the created resource; identical on replay.
        '400':
          description: Invalid input, unknown field or missing header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Session authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role denied or invalid/missing CSRF token
