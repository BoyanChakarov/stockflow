components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          examples:
          - INSUFFICIENT_STOCK
          - INVALID_ORDER_TRANSITION
          - PRODUCT_INACTIVE
          - CUSTOMER_INACTIVE
          - DUPLICATE_SKU
          - IDEMPOTENCY_KEY_REUSED
          - RETRYABLE_CONFLICT
        detail:
          type: string
        instance:
          type: string
        requestId: *id001
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
        shortages:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              productId: *id001
              requested: &id008
                type: integer
                format: int64
                minimum: 0
              available: *id008
            required:
            - productId
            - requested
            - available
      required:
      - type
      - title
      - status
      - code
      - detail
      - instance
      - requestId
    Csrf:
      type: object
      additionalProperties: false
      properties:
        headerName:
          type: string
          examples:
          - X-CSRF-TOKEN
        parameterName:
          type: string
          examples:
          - _csrf
        token:
          type: string
      required:
      - headerName
      - parameterName
      - token
    Actor:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - STAFF
      required:
      - id
      - username
      - role
    CreateProduct:
      type: object
      additionalProperties: false
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        unitPrice: &id009
          oneOf:
          - type: string
            pattern: ^\d{1,6}(\.\d{1,2})?$
            examples:
            - '12.50'
          - type: number
            minimum: 0
            maximum: 999999.99
            multipleOf: 0.01
        reorderThreshold: *id008
      required:
      - sku
      - name
      - unitPrice
      - reorderThreshold
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        unitPrice: *id009
        reorderThreshold: *id008
        active:
          type: boolean
      required: []
      minProperties: 1
    Product:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        sku:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        unitPrice: &id012
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '12.50'
        reorderThreshold: *id008
        active:
          type: boolean
        onHand: *id008
        reserved: *id008
        available: *id008
        createdAt: *id004
        updatedAt: *id004
      required:
      - id
      - sku
      - name
      - description
      - unitPrice
      - reorderThreshold
      - active
      - onHand
      - reserved
      - available
      - createdAt
      - updatedAt
    CreateCustomer:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        email:
          type:
          - string
          - 'null'
          maxLength: 254
          format: email
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
      required:
      - name
    CustomerPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
        email:
          type:
          - string
          - 'null'
          maxLength: 254
          format: email
        phone:
          type:
          - string
          - 'null'
          maxLength: 40
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
        active:
          type: boolean
          description: Only ADMIN may submit this field, even if its value would not
            change.
      required: []
      minProperties: 1
    Customer:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        active:
          type: boolean
        createdAt: *id004
        updatedAt: *id004
      required:
      - id
      - name
      - email
      - phone
      - notes
      - active
      - createdAt
      - updatedAt
    Receipt:
      type: object
      additionalProperties: false
      properties:
        productId: *id001
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        reason:
          type: string
          maxLength: 500
          minLength: 1
      required:
      - productId
      - quantity
      - reason
    Adjustment:
      type: object
      additionalProperties: false
      properties:
        productId: *id001
        delta:
          type: integer
          minimum: -1000000
          maximum: 1000000
          not:
            const: 0
        reason:
          type: string
          maxLength: 500
          minLength: 1
      required:
      - productId
      - delta
      - reason
    Movement:
      type: object
      additionalProperties: false
      properties:
        movementId: *id001
        productId: *id001
        orderId:
          type:
          - string
          - 'null'
          format: uuid
        actorId: *id001
        type: *id010
        deltaOnHand:
          type: integer
          format: int64
        deltaReserved:
          type: integer
          format: int64
        onHandAfter: *id008
        reservedAfter: *id008
        reason:
          type: string
        createdAt: *id004
      required:
      - movementId
      - productId
      - orderId
      - actorId
      - type
      - deltaOnHand
      - deltaReserved
      - onHandAfter
      - reservedAfter
      - reason
      - createdAt
    CreateOrder:
      type: object
      additionalProperties: false
      properties:
        customerId: *id001
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Product IDs must be distinct. Lines are normalized into UUID
            order before hashing.
          items:
            type: object
            additionalProperties: false
            properties:
              productId: *id001
              quantity:
                type: integer
                minimum: 1
                maximum: 1000000
            required:
            - productId
            - quantity
        notes:
          type:
          - string
          - 'null'
          maxLength: 2000
      required:
      - customerId
      - items
    Cancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 1
      required:
      - reason
    EmptyCommand:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    Order:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status: *id011
        customer:
          type: object
          additionalProperties: false
          properties:
            id: *id001
            name:
              type: string
            email:
              type:
              - string
              - 'null'
            phone:
              type:
              - string
              - 'null'
          required:
          - id
          - name
          - email
          - phone
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              productId: *id001
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
              unitPrice: *id012
              lineTotal: *id012
            required:
            - productId
            - sku
            - name
            - quantity
            - unitPrice
            - lineTotal
        currency:
          type: string
          const: EUR
        total: *id012
        notes:
          type:
          - string
          - 'null'
        createdBy: *id001
        createdAt: *id004
        fulfilledAt: &id013
          type:
          - string
          - 'null'
          format: date-time
        cancelledAt: *id013
        cancellationReason:
          type:
          - string
          - 'null'
      required:
      - id
      - status
      - customer
      - items
      - currency
      - total
      - notes
      - createdBy
      - createdAt
      - fulfilledAt
      - cancelledAt
      - cancellationReason
    OrderSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          type: string
          enum:
          - CONFIRMED
          - FULFILLED
          - CANCELLED
        customerId: *id001
        customerName:
          type: string
        quantity: *id008
        currency:
          type: string
          const: EUR
        total: *id012
        createdBy: *id001
        createdAt: *id004
        fulfilledAt: *id013
        cancelledAt: *id013
      required:
      - id
      - status
      - customerId
      - customerName
      - quantity
      - currency
      - total
      - createdBy
      - createdAt
      - fulfilledAt
      - cancelledAt
    OrderEvent:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        orderId: *id001
        actorId: *id001
        fromStatus:
          type:
          - string
          - 'null'
        toStatus:
          type: string
          enum:
          - CONFIRMED
          - FULFILLED
          - CANCELLED
        reason:
          type:
          - string
          - 'null'
        createdAt: *id004
      required:
      - id
      - orderId
      - actorId
      - fromStatus
      - toStatus
      - reason
      - createdAt
    Dashboard:
      type: object
      additionalProperties: false
      properties:
        activeProductCount: *id008
        confirmedOrderCount: *id008
        lowStockProductCount: *id008
        lowStock:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Product'
      required:
      - activeProductCount
      - confirmedOrderCount
      - lowStockProductCount
      - lowStock
    ProductPage:
      type: object
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page: *id008
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements: *id008
        totalPages: *id008
      required:
      - content
      - page
