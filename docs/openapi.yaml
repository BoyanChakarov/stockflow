openapi: 3.1.0
info:
  title: StockFlow API
  version: 1.0.0
  description: One warehouse, whole-unit inventory, EUR quoted totals. Session cookies
    and CSRF protect same-origin browser/API access. All monetary responses use two-decimal
    strings; all timestamps are UTC. Unknown request fields are rejected.
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:8080
security:
- session: []
paths:
  /api/v1/csrf:
    get:
      summary: Obtain the session CSRF token
      operationId: getApiV1Csrf
      tags:
      - csrf
      description: 'Permission: Public. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '400':
          description: Invalid input, unknown field or missing header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Session authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role denied or invalid/missing CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Stock, state, uniqueness or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Lock timeout/deadlock; retry unchanged with the same key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: string
                const: '1'
              description: Retry after one second.
      parameters: []
      security: []
  /api/v1/me:
    get:
      summary: Current actor
