<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title + ' · StockFlow'}">StockFlow</title><link rel="stylesheet" th:href="@{/css/app.css}"><script defer th:src="@{/js/app.js}"></script></head><body>
<aside class="sidebar" th:fragment="nav"><a class="brand" href="/"><span class="brand-mark">▤</span> StockFlow<span class="brand-dot">.</span></a><div class="workspace-label">WORKSPACE</div><nav aria-label="Main navigation"><a href="/" th:classappend="${section=='overview'?'selected':''}"><span>◫</span> Overview</a><a href="/products" th:classappend="${section=='products'?'selected':''}"><span>▦</span> Products</a><a href="/orders" th:classappend="${section=='orders'?'selected':''}"><span>▤</span> Orders</a><a href="/customers" th:classappend="${section=='customers'?'selected':''}"><span>♧</span> Customers</a><a th:if="${actor.admin()}" href="/inventory/movements" th:classappend="${section=='inventory'?'selected':''}"><span>↔</span> Stock history</a></nav><div class="sidebar-bottom"><div class="warehouse"><span class="online-dot"></span> Main warehouse<small>Single warehouse · EUR</small></div><div class="profile"><span class="avatar" th:text="${#strings.substring(actor.username(),0,1).toUpperCase()}">A</span><div><strong th:text="${actor.username()}">admin</strong><small th:text="${actor.role()}">ADMIN</small></div><form th:action="@{/logout}" method="post"><button class="signout" title="Sign out" aria-label="Sign out">↪</button></form></div></div></aside>
<header class="topbar" th:fragment="top"><div><span class="crumb">Workspace</span><span class="slash">/</span><span th:text="${title}">Overview</span></div><span class="timezone">All timestamps in UTC</span></header>
<div th:fragment="feedback"><div class="notice success" role="status" th:if="${param.saved!=null}">Saved successfully.</div><div id="feedback" role="alert" class="notice error" hidden tabindex="-1"></div></div>
<div class="pagination" th:fragment="pagination"><span th:text="${data.totalElements()+' records · Page '+(data.page()+1)+' of '+(data.totalPages()==0?1:data.totalPages())}"></span><div><button class="button secondary small" type="button" th:disabled="${data.page()==0}" th:attr="data-page=${data.page()-1}">← Previous</button><button class="button secondary small" type="button" th:disabled="${data.page()+1>=data.totalPages()}" th:attr="data-page=${data.page()+1}">Next →</button></div></div>
</body></html>
