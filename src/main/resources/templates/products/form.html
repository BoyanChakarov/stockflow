<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><a class="skip-link" href="#main">Skip to content</a><aside th:replace="~{fragments :: nav}"></aside><div class="shell"><header th:replace="~{fragments :: top}"></header><main id="main"><div th:replace="~{fragments :: feedback}"></div><div class="page-heading"><div><p class="eyebrow">CATALOGUE</p><h1><span th:text="${title}"></span></h1><p class="subheading">Catalogue details stay separate from your stock balances.</p></div></div>
<form class="panel edit-form" data-kind="product" th:attr="data-endpoint=${product==null?'/api/v1/products':'/api/v1/products/'+product.id()},data-method=${product==null?'POST':'PATCH'},data-redirect='/products'">
<div class="form-grid"><label>SKU<input name="sku" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" th:value="${product?.sku()}" th:disabled="${product!=null}"><small>Unique and permanent. Letters, numbers, dots, dashes and underscores.</small><span class="field-error" data-field="sku"></span></label><label>Product name<input name="name" required maxlength="200" th:value="${product?.name()}"><span class="field-error" data-field="name"></span></label><label>Unit price (EUR)<input name="unitPrice" required inputmode="decimal" pattern="[0-9]{1,6}(\.[0-9]{1,2})?" th:value="${product==null?'0.00':product.unitPrice()}"><span class="field-error" data-field="unitPrice"></span></label><label>Reorder threshold<input name="reorderThreshold" type="number" required min="0" step="1" th:value="${product==null?0:product.reorderThreshold()}"><span class="field-error" data-field="reorderThreshold"></span></label><label class="wide">Description<textarea name="description" rows="4" maxlength="2000" th:text="${product?.description()}"></textarea><span class="field-error" data-field="description"></span></label></div><div class="form-actions"><a href="/products" class="button secondary">Back to products</a><button class="button">Save product</button></div></form><footer>StockFlow <span>Inventory in balance.</span></footer></main></div></body></html>
