<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><a class="skip-link" href="#main">Skip to content</a><aside th:replace="~{fragments :: nav}"></aside><div class="shell"><header th:replace="~{fragments :: top}"></header><main id="main"><div th:replace="~{fragments :: feedback}"></div><div class="page-heading"><div><p class="eyebrow">CATALOGUE</p><h1>Products</h1><p class="subheading">Know what’s on the shelf and what’s available.</p></div><a th:if="${actor.admin()}" class="button" href="/products/new">＋ New product</a></div>
<section class="panel"><form class="filters" method="get"><label class="search filter">Search products<input name="q" placeholder="Search by name or SKU" maxlength="100" th:value="${param.q}"></label><label class="filter">Status<select name="active"><option value="">All states</option><option value="true" th:selected="${param.active!=null and param.active[0]=='true'}">Active</option><option value="false" th:selected="${param.active!=null and param.active[0]=='false'}">Archived</option></select></label><button class="button secondary">Apply filters</button><a class="text-link" href="/products">Reset</a></form><div class="table-wrap"><table><thead><tr><th>Product</th><th>Unit price</th><th>On-hand</th><th>Reserved</th><th>Available</th><th>Status</th></tr></thead><tbody><tr th:each="p:${data.content()}"><td><a class="product-cell" th:href="@{/products/{id}(id=${p.id()})}"><span class="item-icon">▦</span><span><strong th:text="${p.name()}"></strong><small th:text="${p.sku()}"></small></span></a></td><td th:text="${'€ '+p.unitPrice()}"></td><td th:text="${p.onHand()}"></td><td th:text="${p.reserved()}"></td><td><span th:class="${p.available()<=p.reorderThreshold()?'stock-low':'stock-normal'}" th:text="${p.available()}"></span></td><td><span class="badge" th:classappend="${p.active()?'green':'neutral'}" th:text="${p.active()?'Active':'Archived'}"></span></td></tr><tr th:if="${data.content().isEmpty()}"><td colspan="6" class="empty">No products found. Try another search or add a product.</td></tr></tbody></table></div><div th:replace="~{fragments :: pagination}"></div></section><footer>StockFlow <span>Inventory in balance.</span></footer></main></div></body></html>
