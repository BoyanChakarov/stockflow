<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request could not be completed · StockFlow</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main>
      <section class="panel edit-form">
        <p class="eyebrow">STOCKFLOW</p>
        <h1 th:text="${problem.title}">Request could not be completed</h1>
        <p th:text="${problem.detail}"></p>
        <p class="muted small">Request ID: <span th:text="${problem.requestId}"></span></p>
        <p class="muted">Use your browser’s Back button to keep your filters, or return to the overview.</p>
        <a class="button" href="/">Back to overview</a>
      </section>
    </main>
  </body>
</html>
