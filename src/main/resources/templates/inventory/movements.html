<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><a class="skip-link" href="#main">Skip to content</a><aside th:replace="~{fragments :: nav}"></aside><div class="shell"><header th:replace="~{fragments :: top}"></header><main id="main"><div th:replace="~{fragments :: feedback}"></div><div class="page-heading"><div><p class="eyebrow">AUDIT TRAIL</p><h1>Stock history</h1><p class="subheading">Every movement, with its reason and the resulting balance.</p></div></div>
<section class="panel"><form class="filters wrapping" method="get"><label class="filter">Product UUID<input name="productId" th:value="${param.productId}" placeholder="All products"></label><label class="filter">Movement<select name="type"><option value="">All types</option><option th:each="t:${ {'RECEIPT','ADJUSTMENT','RESERVE','FULFIL','RELEASE'} }" th:value="${t}" th:text="${t}" th:selected="${param.type!=null and param.type[0]==t}"></option></select></label><label class="filter">From (inclusive, UTC)<input name="from" th:value="${param.from}" placeholder="2026-10-01T00:00:00Z"></label><label class="filter">To (exclusive, UTC)<input name="to" th:value="${param.to}" placeholder="2026-11-01T00:00:00Z"></label><button class="button secondary">Apply filters</button><a class="text-link" href="/inventory/movements">Reset</a></form><div class="table-wrap"><table><thead><tr><th>Movement / UTC</th><th>Product / reason</th><th>Δ On-hand</th><th>Δ Reserved</th><th>Balance after</th><th>Actor / order</th></tr></thead><tbody><tr th:each="m:${data.content()}"><td><span class="badge neutral" th:text="${m.type()}"></span><small class="block muted" th:text="${m.createdAt()}"></small></td><td><a class="mono small" th:href="@{/products/{id}(id=${m.productId()})}" th:text="${m.productId()}"></a><small class="block" th:text="${m.reason()}"></small></td><td th:text="${m.deltaOnHand()}"></td><td th:text="${m.deltaReserved()}"></td><td><span th:text="${m.onHandAfter()}"></span> on-hand<br><small class="muted"><span th:text="${m.reservedAfter()}"></span> reserved</small></td><td><small class="mono" th:text="${m.actorId()}"></small><a th:if="${m.orderId()!=null}" class="block text-link small" th:href="@{/orders/{id}(id=${m.orderId()})}">Related order →</a></td></tr><tr th:if="${data.content().isEmpty()}"><td colspan="6" class="empty">No movements match these filters.</td></tr></tbody></table></div><div th:replace="~{fragments :: pagination}"></div></section><footer>StockFlow <span>Inventory in balance.</span></footer></main></div></body></html>
