<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head}"></head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside th:replace="~{fragments :: nav}"></aside>
    <div class="shell">
      <header th:replace="~{fragments :: top}"></header>
      <main id="main">
        <div th:replace="~{fragments :: feedback}"></div>
        <div class="page-heading">
          <div>
            <p class="eyebrow">ORDER DESK</p>
            <h1>Orders</h1>
            <p class="subheading">
              Every reservation, fulfilment and cancellation in one place.
            </p>
          </div>
          <a class="button" href="/orders/new">＋ Create order</a>
        </div>
        <section class="panel">
          <form class="filters wrapping" method="get">
            <label class="filter"
              >Status<select name="status">
                <option value="">All statuses</option>
                <option
                  th:each="s:${ {'CONFIRMED','FULFILLED','CANCELLED'} }"
                  th:value="${s}"
                  th:text="${s}"
                  th:selected="${param.status!=null and param.status[0]==s}"
                ></option></select></label
            ><label class="filter"
              >Customer UUID<input
                name="customerId"
                placeholder="Any customer"
                th:value="${param.customerId}" /></label
            ><label class="filter"
              >From (inclusive, UTC)<input
                name="from"
                placeholder="2026-10-01T00:00:00Z"
                th:value="${param.from}" /></label
            ><label class="filter"
              >To (exclusive, UTC)<input
                name="to"
                placeholder="2026-11-01T00:00:00Z"
                th:value="${param.to}" /></label
            ><button class="button secondary">Apply filters</button
            ><a class="text-link" href="/orders">Reset</a>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order / created (UTC)</th>
                  <th>Customer / creator</th>
                  <th>Units</th>
                  <th>Quoted total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="o:${data.content()}">
                  <td>
                    <a
                      class="order-reference"
                      th:href="@{/orders/{id}(id=${o.id()})}"
                      th:text="${o.id()}"
                    ></a
                    ><small
                      class="block muted"
                      th:text="${o.createdAt()}"
                    ></small>
                  </td>
                  <td>
                    <span th:text="${o.customerName()}"></span
                    ><small
                      class="block muted mono"
                      th:text="${o.createdBy()}"
                    ></small>
                  </td>
                  <td th:text="${o.quantity()}"></td>
                  <td th:text="${'€ '+o.total()}"></td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${o.status()=='CONFIRMED'?'blue':o.status()=='FULFILLED'?'green':'neutral'}"
                      th:text="${o.status()}"
                    ></span>
                  </td>
                </tr>
                <tr th:if="${data.content().isEmpty()}">
                  <td colspan="5" class="empty">
                    No orders found. Create an order to reserve stock.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments :: pagination}"></div>
        </section>
        <footer>StockFlow <span>Inventory in balance.</span></footer>
      </main>
    </div>
  </body>
</html>
