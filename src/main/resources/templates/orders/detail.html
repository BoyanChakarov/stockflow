<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head}"></head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside th:replace="~{fragments :: nav}"></aside>
    <div class="shell">
      <header th:replace="~{fragments :: top}"></header>
      <main id="main">
        <div th:replace="~{fragments :: feedback}"></div>
        <div class="page-heading">
          <div>
            <p class="eyebrow">ORDER DESK</p>
            <h1>Order details</h1>
            <p class="subheading">
              <span class="mono" th:text="${order.id()}"></span>
            </p>
          </div>
          <span
            class="badge large"
            th:classappend="${order.status().name()=='CONFIRMED'?'blue':order.status().name()=='FULFILLED'?'green':'neutral'}"
            th:text="${order.status()}"
          ></span>
        </div>
        <div class="order-layout">
          <div>
            <section class="panel">
              <div class="panel-title">
                <div>
                  <h2 th:text="${order.customer().name()}"></h2>
                  <p>
                    <span
                      th:text="${order.customer().email()?:'No email recorded'}"
                    ></span>
                    <span th:text="${order.customer().phone()}"></span>
                  </p>
                </div>
                <span class="muted small">Frozen at confirmation</span>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>Unit price</th>
                      <th>Quantity</th>
                      <th>Line total</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="i:${order.items()}">
                      <td>
                        <strong th:text="${i.name()}"></strong
                        ><small
                          class="block muted"
                          th:text="${i.sku()}"
                        ></small>
                      </td>
                      <td th:text="${'€ '+i.unitPrice()}"></td>
                      <td th:text="${i.quantity()}"></td>
                      <td th:text="${'€ '+i.lineTotal()}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="panel-foot">
                <span>Quoted order total · EUR</span
                ><strong class="total" th:text="${'€ '+order.total()}"></strong>
              </div>
            </section>
            <section class="panel edit-form">
              <h2>Order history</h2>
              <ol class="timeline">
                <li th:each="e:${events}">
                  <span class="timeline-dot"></span>
                  <div>
                    <strong th:text="${e.toStatus()}"></strong>
                    <p th:if="${e.reason()!=null}" th:text="${e.reason()}"></p>
                    <small class="muted"
                      ><time th:text="${e.createdAt()}"></time> · UTC<br />Actor
                      <span class="mono" th:text="${e.actorId()}"></span
                    ></small>
                  </div>
                </li>
              </ol>
            </section>
          </div>
          <aside class="panel edit-form order-summary">
            <p class="eyebrow">ORDER INFORMATION</p>
            <label
              >Created (UTC)<span
                class="read-value"
                th:text="${order.createdAt()}"
              ></span></label
            ><label
              >Created by<span
                class="read-value mono"
                th:text="${order.createdBy()}"
              ></span></label
            ><label th:if="${order.notes()!=null}"
              >Notes<span class="read-value" th:text="${order.notes()}"></span
            ></label>
            <div th:if="${order.status().name()=='CONFIRMED'}">
              <button
                class="button full"
                type="button"
                th:attr="data-fulfil=${order.id()},data-units=${#aggregates.sum(order.items().![quantity()])}"
              >
                Fulfil order
              </button>
              <form
                data-kind="cancel"
                data-method="POST"
                data-redirect="reload"
                th:attr="data-endpoint=${'/api/v1/orders/'+order.id()+'/cancel'},data-order-id=${order.id()},data-units=${#aggregates.sum(order.items().![quantity()])}"
              >
                <label
                  >Cancellation reason<textarea
                    name="reason"
                    required
                    maxlength="500"
                    rows="3"
                  ></textarea
                  ><span class="field-error" data-field="reason"></span></label
                ><button class="button danger full">Cancel order</button>
              </form>
            </div>
            <div class="notice" th:if="${order.status().name()!='CONFIRMED'}">
              This order is
              <span th:text="${order.status().name().toLowerCase()}"></span>.
              Its contents and history are preserved.
            </div>
            <a class="button secondary full" href="/orders">Back to orders</a>
          </aside>
        </div>
        <footer>StockFlow <span>Inventory in balance.</span></footer>
      </main>
    </div>
  </body>
</html>
