<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><a class="skip-link" href="#main">Skip to content</a><aside th:replace="~{fragments :: nav}"></aside><div class="shell"><header th:replace="~{fragments :: top}"></header><main id="main"><div th:replace="~{fragments :: feedback}"></div><div class="page-heading"><div><p class="eyebrow">YOUR CONTACTS</p><h1>Customers</h1><p class="subheading">The people and businesses behind every order.</p></div><a class="button" href="/customers/new">＋ New customer</a></div>
<section class="panel"><form class="filters" method="get"><label class="search filter">Search customers<input name="q" placeholder="Name, email or phone" maxlength="100" th:value="${param.q}"></label><label class="filter">Status<select name="active"><option value="">All states</option><option value="true" th:selected="${param.active!=null and param.active[0]=='true'}">Active</option><option value="false" th:selected="${param.active!=null and param.active[0]=='false'}">Archived</option></select></label><button class="button secondary">Apply filters</button><a class="text-link" href="/customers">Reset</a></form><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Email</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c:${data.content()}"><td><a th:href="@{/customers/{id}/edit(id=${c.id()})}" th:text="${c.name()}"></a></td><td th:text="${c.email()?:'—'}"></td><td th:text="${c.phone()?:'—'}"></td><td><span class="badge" th:classappend="${c.active()?'green':'neutral'}" th:text="${c.active()?'Active':'Archived'}"></span></td><td><a class="text-link" th:href="@{/customers/{id}/edit(id=${c.id()})}">Edit →</a></td></tr><tr th:if="${data.content().isEmpty()}"><td colspan="5" class="empty">No customers found. Add your first customer to create an order.</td></tr></tbody></table></div><div th:replace="~{fragments :: pagination}"></div></section><footer>StockFlow <span>Inventory in balance.</span></footer></main></div></body></html>
