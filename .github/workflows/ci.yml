name: Verify StockFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
      - name: Compose fresh-start acceptance
        env:
          POSTGRES_PASSWORD: ci-disposable-database-password
          STOCKFLOW_ADMIN_PASSWORD: ci-disposable-admin-password
          STOCKFLOW_STAFF_PASSWORD: ci-disposable-staff-password
        run: |
          docker compose up --build --wait --wait-timeout 180
          npm ci --prefix browser-tests
          npm exec --prefix browser-tests -- playwright install --with-deps chromium
          node browser-tests/workflow.mjs
          python3 scripts/smoke.py
          docker compose restart app
          docker compose up --wait --wait-timeout 120
          python3 scripts/smoke.py --check-restart
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: |
            target/browser-screenshots
            target/browser-result.json
      - name: Verified application JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stockflow-application
          path: target/stockflow.jar
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-disposable-database-password
          STOCKFLOW_ADMIN_PASSWORD: ci-disposable-admin-password
          STOCKFLOW_STAFF_PASSWORD: ci-disposable-staff-password
      - name: Clean disposable CI database
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-disposable-database-password
          STOCKFLOW_ADMIN_PASSWORD: ci-disposable-admin-password
          STOCKFLOW_STAFF_PASSWORD: ci-disposable-staff-password
